<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora · 创意工作室</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #0b0f1a;
      --bg-soft: #121829;
      --accent: #6d8bff;
      --accent-2: #b06dff;
      --accent-3: #4be0c4;
      --text: #e8ecf4;
      --text-dim: #9aa6c2;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --radius: 18px;
      --maxw: 1120px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }

    .container { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

    /* ---------- Navbar ---------- */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      background: rgba(11, 15, 26, 0.6);
      border-bottom: 1px solid var(--border);
    }
    nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .logo {
      font-weight: 800; font-size: 1.25rem; letter-spacing: 0.5px;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .nav-links { display: flex; gap: 32px; }
    .nav-links a { color: var(--text-dim); font-size: 0.95rem; transition: color 0.25s; }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      padding: 9px 20px; border-radius: 999px;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #fff !important; font-weight: 600; font-size: 0.9rem;
      transition: transform 0.25s, box-shadow 0.25s; cursor: pointer; border: none;
    }
    .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(109, 139, 255, 0.4); }

    @media (max-width: 720px) { .nav-links { display: none; } }

    /* ---------- Hero ---------- */
    .hero { position: relative; padding: 160px 0 120px; text-align: center; overflow: hidden; }
    .hero .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; z-index: 0; }
    .glow.a { width: 420px; height: 420px; background: var(--accent); top: -80px; left: -60px; }
    .glow.b { width: 360px; height: 360px; background: var(--accent-2); top: 40px; right: -40px; }
    .glow.c { width: 300px; height: 300px; background: var(--accent-3); bottom: -60px; left: 40%; }

    .hero-content { position: relative; z-index: 1; }
    .badge {
      display: inline-block; padding: 6px 16px; border: 1px solid var(--border);
      border-radius: 999px; font-size: 0.82rem; color: var(--text-dim);
      background: var(--card); margin-bottom: 28px;
    }
    .hero h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 800; line-height: 1.1; margin-bottom: 22px; }
    .hero h1 span {
      background: linear-gradient(120deg, var(--accent), var(--accent-2), var(--accent-3));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p { max-width: 620px; margin: 0 auto 40px; color: var(--text-dim); font-size: 1.1rem; }
    .hero-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 13px 30px; border-radius: 999px; font-weight: 600; font-size: 0.98rem;
      transition: transform 0.25s, box-shadow 0.25s; cursor: pointer; border: none;
    }
    .btn-primary { background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #fff; }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 38px rgba(176, 109, 255, 0.45); }
    .btn-ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { transform: translateY(-3px); border-color: var(--accent); }

    /* ---------- Stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 90px; }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 28px 20px; text-align: center; transition: transform 0.3s, border-color 0.3s;
    }
    .stat:hover { transform: translateY(-6px); border-color: var(--accent); }
    .stat .num {
      font-size: 2.1rem; font-weight: 800;
      background: linear-gradient(120deg, var(--accent-3), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .stat .label { color: var(--text-dim); font-size: 0.9rem; }
    @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }

    /* ---------- Section ---------- */
    section.block { padding: 100px 0; }
    .section-head { text-align: center; margin-bottom: 56px; }
    .section-head .tag { color: var(--accent); font-weight: 600; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; }
    .section-head h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 12px 0; font-weight: 800; }
    .section-head p { color: var(--text-dim); max-width: 560px; margin: 0 auto; }

    /* ---------- Features ---------- */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px 28px; transition: transform 0.3s, border-color 0.3s, background 0.3s;
    }
    .card:hover { transform: translateY(-8px); border-color: var(--accent); background: rgba(109, 139, 255, 0.06); }
    .card .icon {
      width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center;
      font-size: 1.5rem; margin-bottom: 20px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .card h3 { font-size: 1.2rem; margin-bottom: 10px; }
    .card p { color: var(--text-dim); font-size: 0.95rem; }
    @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }

    /* ---------- CTA ---------- */
    .cta-box {
      position: relative; text-align: center; padding: 70px 30px; border-radius: 28px;
      background: linear-gradient(135deg, rgba(109,139,255,0.16), rgba(176,109,255,0.16));
      border: 1px solid var(--border); overflow: hidden;
    }
    .cta-box h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-bottom: 16px; }
    .cta-box p { color: var(--text-dim); max-width: 520px; margin: 0 auto 32px; }

    /* ---------- Footer ---------- */
    footer { border-top: 1px solid var(--border); padding: 40px 0; margin-top: 60px; color: var(--text-dim); font-size: 0.9rem; text-align: center; }

    /* reveal animation */
    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="container">
        <nav>
          <div class="logo">{{ brand }}</div>
          <div class="nav-links">
            <a v-for="link in navLinks" :key="link.id" :href="link.href">{{ link.text }}</a>
          </div>
          <button class="nav-cta" @click="scrollTo('contact')">立即合作</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="glow a"></div>
        <div class="glow b"></div>
        <div class="glow c"></div>
        <div class="container hero-content">
          <span class="badge">{{ badge }}</span>
          <h1>用<span>创意与技术</span><br>点亮你的数字世界</h1>
          <p>{{ heroDesc }}</p>
          <div class="hero-btns">
            <button class="btn btn-primary" @click="scrollTo('contact')">开启项目</button>
            <button class="btn btn-ghost" @click="scrollTo('features')">了解更多</button>
          </div>

          <div class="stats" id="stats">
            <div
              v-for="stat in stats"
              :key="stat.label"
              class="stat reveal"
              v-reveal
            >
              <div class="num">{{ stat.display }}</div>
              <div class="label">{{ stat.label }}</div>
            </div>
          </div>
        </div>
      </section>

      <section class="block" id="features">
        <div class="container">
          <div class="section-head reveal" v-reveal>
            <div class="tag">{{ featuresTag }}</div>
            <h2>我们提供的服务</h2>
            <p>从概念到上线，我们提供端到端的数字化解决方案。</p>
          </div>
          <div class="grid">
            <div class="card reveal" v-for="item in features" :key="item.title" v-reveal>
              <div class="icon">{{ item.icon }}</div>
              <h3>{{ item.title }}</h3>
              <p>{{ item.desc }}</p>
            </div>
          </div>
        </div>
      </section>

      <section class="block">
        <div class="container">
          <div class="cta-box reveal" id="contact" v-reveal>
            <h2>准备好开始了吗？</h2>
            <p>告诉我们你的想法，48 小时内我们将为你提供专属方案与报价。</p>
            <button class="btn btn-primary" @click="showContact">免费咨询</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        © 2026 {{ brand }} 创意工作室 · 用心打造每一个像素
      </div>
    </footer>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    // 自定义指令：滚动进入视口时添加可见类，并触发数字动画
    const reveal = {
      mounted(el) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              el.classList.add('visible');
              if (el.dataset.animate === 'stats') startCounters();
              io.unobserve(el);
            }
          });
        }, { threshold: 0.2 });
        io.observe(el);
      }
    };

    let countersStarted = false;
    function startCounters() {
      if (countersStarted) return;
      countersStarted = true;
      stats.forEach((s) => {
        let cur = 0;
        const step = Math.max(1, s.target / 40);
        const timer = setInterval(() => {
          cur += step;
          if (cur >= s.target) { cur = s.target; clearInterval(timer); }
          s.display.value = Math.floor(cur);
        }, 22);
      });
    }

    const stats = [
      { label: '交付项目', target: 120, display: ref(0) },
      { label: '合作客户', target: 48, display: ref(0) },
      { label: '好评率 %', target: 99, display: ref(0) },
      { label: '核心团队', target: 6, display: ref(0) }
    ];

    createApp({
      directives: { reveal },
      setup() {
        const brand = 'Aurora';
        const badge = '✨ 全新品牌 · 2026 启航';
        const heroDesc = '我们是一家专注于网站设计、产品体验与品牌数字化的创意工作室，帮助你的想法快速变成令人惊艳的产品。';
        const featuresTag = 'What We Do';
        const navLinks = [
          { id: 1, text: '服务', href: '#features' },
          { id: 2, text: '实力', href: '#stats' },
          { id: 3, text: '联系', href: '#contact' }
        ];
        const features = [
          { icon: '🎨', title: '视觉设计', desc: '打造独特而一致的品牌视觉系统，让产品在第一眼就脱颖而出。' },
          { icon: '💻', title: '网站开发', desc: '高性能、响应式的现代网站，兼顾美观与极致的用户体验。' },
          { icon: '📱', title: '产品设计', desc: '以用户为中心的交互设计，提升转化与留存。' },
          { icon: '🚀', title: '技术咨询', desc: '为你的技术选型与架构提供专业建议，少走弯路。' },
          { icon: '🔍', title: 'SEO 优化', desc: '让搜索引擎更懂你，带来稳定且高质量的自然流量。' },
          { icon: '🛡️', title: '持续维护', desc: '上线不是终点，我们提供长期稳定可靠的技术支持。' }
        ];

        const scrollTo = (id) => {
          document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        };
        const showContact = () => {
          alert('感谢关注！请通过邮箱 hello@aurora.studio 联系我们。');
        };

        // 标记 stats 区域用于触发计数器
        onMounted(() => {
          const statsEl = document.getElementById('stats');
          if (statsEl) {
            statsEl.querySelectorAll('.stat').forEach((el) => (el.dataset.animate = 'stats'));
          }
        });

        return { brand, badge, heroDesc, featuresTag, navLinks, features, stats, scrollTo, showContact };
      }
    }).mount('#app');
  </script>
</body>
</html>
